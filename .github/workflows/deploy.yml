name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd real_ested/backend
          npm install

      - name: Deploy backend files to Hostycare
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/real_ested/backend
          rsync: |
            real_ested/backend/ appteche@${{ secrets.HOSTYCARE_IP }}:~/real_ested/backend/
