name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies on GitHub runner
        run: |
          cd backend
          npm install

      - name: Zip backend folder
        run: zip -r backend.zip backend/

      - name: Copy zip file to Hostycare server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          source: "backend.zip"
          target: "~/"

      - name: Deploy files (NO PM2)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf ~/real_ested/backend
            mkdir -p ~/real_ested/backend
            unzip -o ~/backend.zip -d ~/real_ested/
            rm -f ~/backend.zip
            echo "✅ Deployment finished. Login to server and start node manually."
