name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostycare Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          script: |
            echo "=== Entering project directory ==="
            mkdir -p ~/public_html/real_ested
            cd ~/public_html/real_ested

            echo "=== Pull latest code from repo ==="
            git pull origin deployment/hostycare

            echo "=== Install dependencies ==="
            npm install

            echo "=== Build project ==="
            npm run build

            echo "=== Deployment complete ==="
