name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies on runner
        run: |
          cd backend
          npm install

      - name: Deploy & Restart Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          script: |
            set -e
            # Go to project folder on cPanel server
            cd ~/real_ested/backend
            # Pull latest code from github
            git pull origin deployment/hostycare
            # Install packages ON SERVER (we tried runner build earlier, switching back to git pull flow)
            npm install
            # Restart pm2 service
            pm2 restart backend || pm2 start server.js --name backend
