name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies on GitHub runner
        run: |
          cd backend
          npm install

      - name: Zip backend folder
        run: |
          cd backend
          zip -r ../backend.zip .

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}

      - name: Transfer zip & Deploy on Hostycare server
        env:
          HOST_IP: ${{ secrets.HOSTYCARE_IP }}
          HOST_USER: ${{ secrets.HOSTYCARE_USERNAME }}
          HOST_PORT: ${{ secrets.HOSTYCARE_PORT }}
        run: |
          mkdir -p ~/.ssh
          PORT="${HOST_PORT:-22}"
          ssh-keyscan -p $PORT -H $HOST_IP >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P $PORT -o StrictHostKeyChecking=no backend.zip ${HOST_USER}@${HOST_IP}:~/backend.zip
          ssh -p $PORT -o StrictHostKeyChecking=no ${HOST_USER}@${HOST_IP} 'bash -s' << 'EOF'
            set -e
            mkdir -p ~/public_html/real_ested/backend
            unzip -o ~/backend.zip -d ~/public_html/real_ested/backend/
            rm -f ~/backend.zip
            mkdir -p ~/public_html/real_ested/backend/tmp
            touch ~/public_html/real_ested/backend/tmp/restart.txt
            echo "✅ Backend deployment and Node server restart completed successfully on Hostycare server."
          EOF
