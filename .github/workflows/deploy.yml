name: Auto Deploy to Hostycare
on:
  push:
    branches:
      - main
      - master
      - deployment/hostycare

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: List repo files (debug - safe to keep)
        run: ls -la

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        run: |
          cd backend
          npm install

      - name: Sync backend to Hostycare & restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/real_ested/backend
            cd ~/real_ested/backend
            pm2 restart backend || pm2 start server.js --name backend
          rsync: |
            backend/ appteche@${{ secrets.HOSTYCARE_IP }}:~/real_ested/backend/
