name: Auto Deploy to Hostycare

on:
  push:
    branches: [ deployment/hostycare ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostycare Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTYCARE_IP }}
          username: ${{ secrets.HOSTYCARE_USERNAME }}
          key: ${{ secrets.HOSTYCARE_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== Starting deployment ==="
            cd /home/appteche/real_ested/backend

            if [ ! -d ".git" ]; then
              echo "First‑time: cloning repository"
              git clone https://github.com/Guru1131/realestate.git .
            fi

            echo "Fetch latest code from deployment/hostycare"
            git fetch origin
            git checkout deployment/hostycare
            git reset --hard origin/deployment/hostycare

            echo "Activate cPanel Node.js virtual env"
            source /home/appteche/nodevenv/real_ested/backend/22/bin/activate

            echo "Run npm install"
            npm install

            echo "Run npm build"
            npm run build

            echo "Restart cPanel NodeJS application"
            /usr/local/cpanel/bin/restart_nodejs_app --user=appteche --app=real_ested

            echo "=== Deployment finished ==="
