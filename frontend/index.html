<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title Tag for SEO & Enterprise branding -->
    <title>PROP-MANAGER - Enterprise Property Sales & Rental System</title>
    
    <meta name="description" content="Secure internal business application for real estate branches and broker network tracking." />

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:99999; position:absolute; top:10px; left:10px; background:white; padding:20px; border:2px solid red;"><b>CRASH:</b> ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:99999; position:absolute; top:100px; left:10px; background:white; padding:20px; border:2px solid red;"><b>PROMISE CRASH:</b> ' + e.reason + '</div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
